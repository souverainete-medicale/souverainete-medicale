<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merci — Souveraineté Médicale</title>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --bleu-nuit: #0A1628; --or: #C5A059; --blanc: #FFFFFF; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #F9F7F4; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .merci-box { background: var(--blanc); max-width: 700px; padding: 80px 60px; text-align: center; border: 4px solid var(--or); box-shadow: 0 20px 60px rgba(0,0,0,0.15); }
        .success-icon { width: 100px; height: 100px; background: var(--or); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 40px; font-size: 4em; color: var(--blanc); }
        .merci-title { font-family: 'Crimson Text', serif; font-size: 2.5em; color: var(--bleu-nuit); margin-bottom: 30px; font-weight: 700; }
        .merci-text { font-size: 1.15em; line-height: 1.9; margin-bottom: 30px; color: #4A4A4A; }
        .separator { width: 120px; height: 3px; background: var(--or); margin: 40px auto; }
        .signature { font-family: 'Crimson Text', serif; font-size: 1.8em; font-style: italic; color: var(--bleu-nuit); margin-bottom: 10px; font-weight: 600; }
        .signature-title { color: var(--or); font-weight: 600; margin-bottom: 50px; font-size: 1.05em; }
        .btn { display: inline-block; background: var(--or); color: var(--blanc); padding: 18px 45px; font-weight: 700; text-decoration: none; text-transform: uppercase; border: 3px solid var(--or); transition: all 0.3s; }
        .btn:hover { background: var(--blanc); color: var(--or); }
        @media (max-width: 768px) { .merci-box { padding: 60px 30px; } }
    </style>
</head>
<body>
    <div class="merci-box">
        <div class="success-icon">✓</div>
        <h1 class="merci-title">Merci pour votre engagement</h1>
        <p class="merci-text">
            Nous étudions votre profil avec la plus grande attention et vous recontacterons 
            dans les meilleurs délais pour échanger sur votre contribution au projet 
            <strong>Souveraineté Médicale</strong>.
        </p>
        <div class="separator"></div>
        <p class="signature">Alexis Javouray</p>
        <p class="signature-title">Président de BLUE HOLDING</p>
        <a href="index.html" class="btn">Retour à l'accueil</a>
    </div>
</body>
</html>
